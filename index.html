<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <button id="edit" class="btn" type="button" aria-expanded="false" aria-controls="panel">Edit</button>
</header>
<main id="grid" class="grid" aria-live="polite"></main>
<div id="panel" class="panel" hidden>
  <div class="panel-head">
    <h2 id="panel-title">Show calendars</h2>
    <button id="done" class="btn btn-primary" type="button">Done</button>
  </div>
  <div class="lang">
    <span id="lang-label" class="lang-label">Language</span>
    <div class="switcher" role="group" aria-labelledby="lang-label">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="ja" lang="ja">日本語</button>
    </div>
  </div>
  <ul id="options" class="options"></ul>
</div>
<script src="app.js"></script>
</body>
</html>
